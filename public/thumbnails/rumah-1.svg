<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" fill="none">
  <rect width="160" height="160" rx="24" fill="#334155"/>
  <!-- Pitched Modern Minimalist Roof -->
  <polygon points="18,58 76,26 142,58" fill="#1e293b" stroke="#94a3b8" stroke-width="2"/>
  <!-- House Wall (Cream / Warm Grey) -->
  <rect x="28" y="58" width="104" height="70" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <!-- Wood Accent Feature Wall -->
  <rect x="36" y="66" width="32" height="62" fill="#b45309" rx="2"/>
  <!-- Front Door -->
  <rect x="42" y="76" width="18" height="52" fill="#78350f" rx="1"/>
  <circle cx="56" cy="102" r="2" fill="#fde047"/>
  <!-- Big Modern Living Room Window -->
  <rect x="76" y="72" width="48" height="44" rx="3" fill="#38bdf8" fill-opacity="0.35" stroke="#0284c7" stroke-width="1.5"/>
  <line x1="100" y1="72" x2="100" y2="116" stroke="#0284c7" stroke-width="1.5"/>
  <line x1="76" y1="94" x2="124" y2="94" stroke="#0284c7" stroke-width="1.5"/>
  <!-- Carport / Patio Accent -->
  <line x1="16" y1="132" x2="144" y2="132" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
</svg>