<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <linearGradient id="bgTavern" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1917"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>
  </defs>
  <rect width="160" height="160" rx="20" fill="url(#bgTavern)"/>
  <!-- Chimney -->
  <rect x="96" y="32" width="16" height="45" fill="#57534e"/>
  <rect x="94" y="30" width="20" height="6" fill="#44403c"/>
  <!-- Ground floor (Stone) -->
