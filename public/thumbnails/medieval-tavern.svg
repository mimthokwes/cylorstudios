  <!-- 2nd floor (Timber overhang) -->
  <rect x="32" y="56" width="96" height="32" rx="2" fill="#b45309"/>
  <!-- Beams -->
  <rect x="34" y="56" width="6" height="32" fill="#78350f"/>
  <rect x="120" y="56" width="6" height="32" fill="#78350f"/>
  <rect x="77" y="56" width="6" height="32" fill="#78350f"/>
  <!-- Roof (Pitched) -->
  <polygon points="80,18 24,58 136,58" fill="#991b1b"/>
  <!-- Door -->
  <rect x="70" y="98" width="20" height="26" rx="4" fill="#451a03"/>
  <!-- Glowing windows -->
  <rect x="44" y="66" width="14" height="14" rx="2" fill="#fef08a"/>
  <rect x="102" y="66" width="14" height="14" rx="2" fill="#fef08a"/>
</svg>
